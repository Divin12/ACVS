<div class="w-full max-w-[480px] bg-surface-container-lowest p-space-12 rounded-xl flex flex-col items-center gap-space-6 relative border border-outline-variant">

<p class="font-body-base text-body-base text-on-surface-variant">Enter the academic certificate ID below or scan the official QR code to verify authenticity.</p>

<form class="w-full flex flex-col gap-space-4">
<!-- Input Group -->
<div class="relative w-full">
<label class="sr-only" for="certificate-id">Certificate ID</label>
<input autocomplete="off" class="w-full bg-surface border border-outline-variant rounded-lg py-space-4 pl-space-4 pr-space-12 font-label-mono text-label-mono text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="certificate-id" name="certificate-id" placeholder="e.g. DRC-ACVS-2024-X8J9" spellcheck="false" type="text">
<!-- Scan Affordance -->
<button aria-label="Scan QR Code" class="absolute right-space-2 top-1/2 -translate-y-1/2 p-space-2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<span class="material-symbols-outlined" style="font-size: 24px;">qr_code_scanner</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-space-4 px-space-6 rounded-lg font-label-mono text-label-mono hover:bg-surface-tint active:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-space-2 mt-space-2 shadow-sm" type="submit">
<span class="material-symbols-outlined" style="font-size: 20px;">verified</span>
                    Verify
                </button>
</form>
