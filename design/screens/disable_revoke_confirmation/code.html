<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Certificate Revocation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&amp;family=JetBrains+Mono:wght@500&amp;family=Libre+Franklin:wght@600;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fefcff",
                        "secondary": "#6e5e00",
                        "outline": "#717786",
                        "secondary-fixed": "#ffe255",
                        "on-surface": "#1c1b1b",
                        "tertiary-fixed": "#ffdad6",
                        "inverse-on-surface": "#f3f0ef",
                        "on-primary-fixed-variant": "#004590",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e5e2e1",
                        "on-secondary-fixed": "#211b00",
                        "surface-container-high": "#eae7e7",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#001b3f",
                        "on-tertiary-fixed": "#410003",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "surface-container-low": "#f6f3f2",
                        "outline-variant": "#c1c6d7",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#e5c500",
                        "inverse-surface": "#313030",
                        "surface-dim": "#dcd9d9",
                        "surface": "#fcf9f8",
                        "on-tertiary-fixed-variant": "#930011",
                        "on-tertiary-container": "#fffbff",
                        "on-surface-variant": "#414754",
                        "background": "#fcf9f8",
                        "primary-container": "#0072e5",
                        "on-secondary-container": "#706000",
                        "tertiary-container": "#e2242c",
                        "secondary-container": "#fddc21",
                        "surface-tint": "#005cbc",
                        "surface-container": "#f0eded",
                        "surface-bright": "#fcf9f8",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "inverse-primary": "#abc7ff",
                        "tertiary": "#bb0019",
                        "primary": "#005ab7",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e5e2e1",
                        "on-secondary-fixed-variant": "#534600",
                        "primary-fixed": "#d7e2ff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#abc7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                    "spacing": {
                        "space-4": "16px",
                        "space-6": "24px",
                        "space-2": "8px",
                        "container-max": "1280px",
                        "space-12": "48px",
                        "space-1": "4px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "text-xs": ["Arimo"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-md": ["Libre Franklin"],
                        "display-lg": ["Libre Franklin"],
                        "body-base": ["Arimo"]
                    },
                    "fontSize": {
                        "text-xs": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "label-mono": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base antialiased h-screen w-screen overflow-hidden">
<!-- Background Dimming Overlay (Simulating background content) -->
<div class="absolute inset-0 bg-surface-variant/80 backdrop-blur-sm z-40 flex items-center justify-center p-space-6">
<!-- Revocation Modal -->
<div class="bg-surface border-2 border-on-surface shadow-[8px_8px_0px_0px_rgba(28,27,27,1)] max-w-lg w-full flex flex-col relative z-50">
<!-- Modal Header -->
<div class="flex items-center gap-space-4 p-space-6 border-b-2 border-on-surface bg-surface-container">
<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center bg-on-surface rounded-full p-2">
<img alt="Ministry Coat of Arms" class="w-full h-full object-contain filter invert" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight">Permanent Revocation</h2>
<p class="font-text-xs text-text-xs text-on-surface-variant uppercase tracking-wider mt-1">Official Administrative Action</p>
</div>
<button aria-label="Close modal" class="ml-auto p-2 hover:bg-surface-variant transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface">close</span>
</button>
</div>
<!-- Modal Content -->
<div class="p-space-6 flex flex-col gap-space-6">
<!-- Warning Banner -->
<div class="bg-error-container border-l-4 border-error p-space-4 flex gap-space-4 items-start">
<span aria-hidden="true" class="material-symbols-outlined text-error mt-1">warning</span>
<div>
<p class="font-body-base text-body-base text-on-error-container font-bold">This action is permanent and will be visible on the public record.</p>
<p class="font-text-xs text-text-xs text-on-error-container mt-1">Once revoked, this certificate can no longer be validated by third parties.</p>
</div>
</div>
<!-- Target ID -->
<div>
<label class="block font-text-xs text-text-xs text-on-surface-variant mb-space-2 uppercase tracking-wide">Target Certificate ID</label>
<div class="bg-surface-container-highest border border-outline p-space-4 flex justify-between items-center">
<code class="font-label-mono text-label-mono text-on-surface">DRC-2024-ACVS-9A4F-B2C1-77XQ</code>
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant text-sm cursor-help" title="Immutable Record ID">lock</span>
</div>
</div>
<!-- Reason Form -->
<div>
<label class="block font-text-xs text-text-xs text-on-surface-variant mb-space-2 uppercase tracking-wide" for="revocationReason">Reason for Revocation <span class="text-error">*</span></label>
<textarea class="w-full bg-surface border-2 border-outline p-space-4 font-body-base text-body-base text-on-surface focus:border-on-surface focus:ring-0 placeholder-on-surface-variant resize-none" id="revocationReason" placeholder="Provide official justification for revocation..." rows="3"></textarea>
</div>
</div>
<!-- Modal Actions -->
<div class="p-space-6 border-t-2 border-on-surface bg-surface-container flex justify-end gap-space-4">
<button class="px-space-6 py-space-2 border-2 border-on-surface text-on-surface font-body-base text-body-base font-bold hover:bg-surface-variant transition-colors">
                    Cancel
                </button>
<!-- Disabled state initially, activates on input (simulated) -->
<button class="px-space-6 py-space-2 border-2 border-error text-error font-body-base text-body-base font-bold hover:bg-error hover:text-on-error transition-colors flex items-center gap-2 opacity-50 cursor-not-allowed">
<span aria-hidden="true" class="material-symbols-outlined text-sm">gavel</span>
                    Disable Certificate
                </button>
</div>
</div>
</div>
</body></html>
