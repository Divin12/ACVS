<body class="bg-surface text-on-surface font-body-base antialiased min-h-screen flex flex-col items-center justify-center p-space-6">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant shadow-sm rounded-lg p-space-6 md:p-12 relative overflow-hidden">
<!-- Subtle top border accent indicating official nature -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="flex flex-col items-center text-center mb-10">
<div class="w-24 h-24 mb-space-4 bg-primary rounded-full flex items-center justify-center p-4">
<img alt="ACVS Logo" class="w-full h-full object-contain filter invert brightness-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuh_TSrBbe3LcEN5fi-JXpCFe0mcUGk_Y6OEKOJlx_BYh0Epki5FPH0sTEbgEfxkjn9bqwROo1XoXmfHlTa2gwQh69iNR7DdbMz3nXajOYacOJSkh-5GUV3oMeT4gUVYPuau50iE5t8tMMF3l5j3SQM1TbjNYaIblpu3eKX2u-1kwdPaNhEIHttAemQTHu4qi5ejIZUans0I3_Nd5AvPvkE16rGmr6iwJMpz_-rwP-zO3Nk5zbeObG3BsN0LuiFwYqAw"/>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">ACVS</h1>
<h2 class="font-headline-md text-headline-md text-on-surface-variant leading-tight">Ministry Administrator Portal</h2>
</div>
<form class="space-y-space-6">
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-surface focus:ring-primary focus:border-primary text-on-surface sm:text-sm transition-colors placeholder-outline" id="email" name="email" placeholder="admin@edu.gouv.cd" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-surface focus:ring-primary focus:border-primary text-on-surface sm:text-sm transition-colors placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-space-2 mb-space-6">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-base text-body-base text-on-surface-variant" for="remember-me">
                        Remember session
                    </label>
</div>
<div class="text-sm">
<a class="font-body-base text-body-base text-primary hover:text-primary-fixed-dim font-medium transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded bg-primary text-on-primary font-headline-md text-body-base hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm transition-all active:scale-[0.98]" type="submit">
                Sign In
            </button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant text-center">
<p class="font-text-xs text-text-xs text-outline flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="security">security</span>
                Authorized Personnel Only
            </p>
</div>
</div>
