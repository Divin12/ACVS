<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ACVS DRC - Two-Factor Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400..700&amp;family=JetBrains+Mono:wght@400..700&amp;family=Libre+Franklin:wght@400..800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {
                    "colors": {
                        "outline-variant": "#c1c6d7",

                        "surface-container-highest": "#e5e2e1",
                        "primary-container": "#0072e5",

                        "on-tertiary-fixed": "#410003",
                        "surface-container-high": "#eae7e7",
                        "tertiary-fixed": "#ffdad6",
                        "primary-fixed-dim": "#abc7ff",
                        "error-container": "#ffdad6",
                        "surface": "#fcf9f8",
                        "primary": "#005ab7",
                        "surface-container-low": "#f6f3f2",
                        "inverse-surface": "#313030",
                        "inverse-on-surface": "#f3f0ef",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "tertiary-container": "#e2242c",
                        "on-primary-fixed": "#001b3f",
                        "surface-bright": "#fcf9f8",
                        "primary-fixed": "#d7e2ff",
                        "on-secondary": "#ffffff",
                        "tertiary": "#bb0019",
                        "surface-container": "#f0eded",
                        "background": "#fcf9f8",
                        "outline": "#717786",
                        "on-primary-fixed-variant": "#004590",
                        "secondary-container": "#fddc21",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#706000",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#e5c500",
                        "surface-tint": "#005cbc",
                        "surface-dim": "#dcd9d9",
                        "on-surface": "#1c1b1b",
                        "on-secondary-fixed-variant": "#534600",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-container": "#fefcff",
                        "inverse-primary": "#abc7ff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#414754",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#6e5e00",
                        "surface-variant": "#e5e2e1",
                        "secondary-fixed": "#ffe255",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",

                    },
                    "spacing": {
                        "space-6": "24px",
                        "space-12": "48px",
                        "space-1": "4px",
                        "space-4": "16px",
                        "space-2": "8px",
                        "unit": "4px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "headline-md": ["Libre Franklin"],
                        "text-xs": ["Arimo"],
                        "body-base": ["Arimo"],
                        "label-mono": ["JetBrains Mono"],
                        "display-lg": ["Libre Franklin"]
                    },
                    "fontSize": {
                        "headline-md": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "text-xs": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-mono": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "display-lg": ["36px", { "lineHeight": "1.1", "letterSpacing": "-0.01em", "fontWeight": "800" }]

                },
            },
        }

<style>
        .tricolor-bar {
            background: linear-gradient(to right, #0072e5 33.33%, #fddc21 33.33%, #fddc21 66.66%, #e2242c 66.66%);
        }
        
        .code-input {
            letter-spacing: 0.5em;
            text-align: center;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-base p-4">
<!-- Suppressed navigation shell for linear transactional page -->
<div class="w-full max-w-[480px] bg-surface rounded-lg shadow-sm border border-outline-variant overflow-hidden">
<!-- Tricolor Brand Bar -->
<div class="h-2 w-full tricolor-bar"></div>
<div class="p-8 flex flex-col items-center text-center">
<!-- Ministry Emblem Placeholder -->
<div class="mb-6 h-20 w-20 rounded-full border border-outline flex items-center justify-center bg-surface-container-low">
<span class="material-symbols-outlined text-4xl text-on-surface-variant">verified_user</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Identity Verification</h1>
<p class="font-body-base text-body-base text-on-surface-variant mb-8">
                Enter the code sent to your registered device to verify your identity.
            </p>
<!-- Secure Input Form -->
<form class="w-full" onsubmit="event.preventDefault();">
<div class="mb-8">
<label class="sr-only" for="verification_code">Verification Code</label>
<input autocomplete="one-time-code" class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-4 font-label-mono text-2xl font-bold text-on-surface focus:ring-2 focus:ring-primary focus:border-primary code-input" id="verification_code" maxlength="6" name="verification_code" pattern="\d{6}" placeholder="000000" required="" type="text"/>
<p class="mt-2 text-left font-text-xs text-text-xs text-outline">
<span class="material-symbols-outlined text-[14px] align-middle mr-1">lock</span> Secure transmission
                    </p>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-DEFAULT font-bold hover:opacity-90 transition-opacity mb-4" type="submit">
                    Verify
                </button>
</form>
<div class="mt-4 border-t border-surface-variant w-full pt-4">
<button class="font-body-base text-body-base text-primary hover:underline bg-transparent border-none cursor-pointer">
                    Resend Code
                </button>
</div>
</div>
</div>
<div class="mt-8 text-center max-w-[480px]">
<p class="font-text-xs text-text-xs text-on-surface-variant">
            Système de Vérification des Certificats Académiques<br/>
            Ministère de l'Éducation Nationale et Nouvelle Citoyenneté
        </p>
</div>
</body></html>
